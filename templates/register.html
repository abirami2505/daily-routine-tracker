{% extends 'base.html' %}
{% block title %}Register – Daily Routine Tracker{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🚀</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start your discipline journey today. Build habits that last.</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="registerForm" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="Choose a username (min 3 chars)"
          autocomplete="username"
          required
          minlength="3"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Create a password (min 6 chars)"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-input"
            placeholder="Repeat your password"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Toggle confirm password visibility">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full" id="registerBtn">
        <span class="btn-text">Create Account</span>
        <span class="btn-loader" hidden>Creating…</span>
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
