{% extends 'base.html' %}
{% block title %}Login – Daily Routine Tracker{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">⚡</div>
      <h1 class="auth-title">Routine Tracker</h1>
      <p class="auth-subtitle">Welcome back! Sign in to continue your discipline journey.</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader" hidden>Signing in…</span>
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="auth-link">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
